<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <main>
    <article class="card">
      <img class="card_image" src="./assets/images/illustration-article.svg" alt="Yellow and black geometric image">

      <p class="card_tag">Learning</p>
      
      <p class="card_date">Published 21 Dec 2023</p>

      <h1 class="card_title"><a href="#">HTML & CSS foundations</a></h1>

      <p class="card_text">These languages are the backbone of every website, defining structure, content, and presentation.</p>

      <div class="card_author">
        <img class="card_avatar" src="./assets/images/image-avatar.webp" alt="Photo of Greg Hooper">
        <p class="card_author_name">Greg Hooper</p>
      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Rashaad Galloway</a>.
  </footer>
</body>
</html>
